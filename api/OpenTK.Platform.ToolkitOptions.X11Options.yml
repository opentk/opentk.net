- uid: OpenTK.Platform.ToolkitOptions.X11Options.DealWithVSCodeEnvironmentVariablePollution
  commentId: P:OpenTK.Platform.ToolkitOptions.X11Options.DealWithVSCodeEnvironmentVariablePollution
  id: DealWithVSCodeEnvironmentVariablePollution
  parent: OpenTK.Platform.ToolkitOptions.X11Options
  langs:
