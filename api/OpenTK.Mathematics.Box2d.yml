    path: C:\Users\juliu\Documents\GitHub\opentk.net\website\opentk\src\OpenTK.Mathematics\Geometry\Box2d.cs
    startLine: 626
  assemblies:
  - OpenTK.Mathematics
  namespace: OpenTK.Mathematics
  summary: >-
    Returns a box that is extended to encapsulate a given point.

    With NaN propagation and -0 behaviour being platform dependent.
  remarks: This can be used in combination with <xref href="OpenTK.Mathematics.Box2d.Empty" data-throw-if-not-resolved="false"></xref> to make an efficient bounding box calculation.
  example:
  - >-
    For example:


    <pre><code class="lang-csharp">Vector2d[] points = GetPoints();

    Box2d aabb = Box2d.Empty;

    for (int i = 0; i &lt; points.Length; i++)

    {
        aabb = aabb.Extended(points[i]):
    }</code></pre>


    Will calculate the bounding box of all the points in the array without needing a special case for the first point.
  syntax:
    content: public readonly Box2d ExtendedNative(Vector2d point)
    parameters:
    - id: point
      type: OpenTK.Mathematics.Vector2d
      description: The point to contain.
    return:
      type: OpenTK.Mathematics.Box2d
      description: The extended box.
    content.vb: Public Function ExtendedNative(point As Vector2d) As Box2d
