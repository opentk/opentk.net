    path: C:\Users\juliu\Documents\GitHub\opentk.net\website\opentk\src\OpenTK.Mathematics\Geometry\Box2i.cs
    startLine: 511
  assemblies:
  - OpenTK.Mathematics
  namespace: OpenTK.Mathematics
  summary: Extends this box to encapsulate a given point.
  remarks: This can be used in combination with <xref href="OpenTK.Mathematics.Box2i.Empty" data-throw-if-not-resolved="false"></xref> to make an efficient bounding box calculation.
  example:
  - >-
    For example:


    <pre><code class="lang-csharp">Vector2i[] points = GetPoints();

    Box2i aabb = Box2i.Empty;

    for (int i = 0; i &lt; points.Length; i++)

    {
        aabb.Extend(points[i]):
    }</code></pre>


    Will calculate the bounding box of all the points in the array without needing a special case for the first point.
  syntax:
    content: public void Extend(Vector2i point)
    parameters:
    - id: point
      type: OpenTK.Mathematics.Vector2i
      description: The point to contain.
    content.vb: Public Sub Extend(point As Vector2i)
  overload: OpenTK.Mathematics.Box2i.Extend*
