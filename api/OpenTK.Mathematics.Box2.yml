  type: Field
  source:
    id: Empty
    path: C:\Users\juliu\Documents\GitHub\opentk.net\website\opentk\src\OpenTK.Mathematics\Geometry\Box2.cs
    startLine: 38
  assemblies:
  - OpenTK.Mathematics
  namespace: OpenTK.Mathematics
  summary: >-
    An empty box with <code>Min = Vector2.PositiveInfinity</code> and <code>Max = Vector2.NegativeInfinity</code>.

    This box can be used with <xref href="OpenTK.Mathematics.Box2.Extend(OpenTK.Mathematics.Vector2)" data-throw-if-not-resolved="false"></xref> to create a bounding box without a special case for the first point.
  example:
  - >-
    For example:


    <pre><code class="lang-csharp">Vector2[] points = GetPoints();

    Box2 aabb = Box2.Empty;

    for (int i = 0; i &lt; points.Length; i++)

    {
        aabb.Extend(points[i]):
    }</code></pre>


    Will calculate the bounding box of all the points in the array without needing a special case for the first point.
  syntax:
    content: public static readonly Box2 Empty
    return:
      type: OpenTK.Mathematics.Box2
    content.vb: Public Shared ReadOnly Empty As Box2
