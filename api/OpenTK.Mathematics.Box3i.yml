  fullName: OpenTK.Mathematics.Box3i.Empty
  type: Field
  source:
    id: Empty
    path: C:\Users\juliu\Documents\GitHub\opentk.net\website\opentk\src\OpenTK.Mathematics\Geometry\Box3i.cs
    startLine: 37
  assemblies:
  - OpenTK.Mathematics
  namespace: OpenTK.Mathematics
  summary: >-
    An empty box with <code>Min = Vector3i.MaxValue</code> and <code>Max = Vector3i.MinValue</code>.

    This box can be used with <xref href="OpenTK.Mathematics.Box3i.Extend(OpenTK.Mathematics.Vector3i)" data-throw-if-not-resolved="false"></xref> to create a bounding box without a special case for the first point.
  example:
  - >-
    For example:


    <pre><code class="lang-csharp">Vector3i[] points = GetPoints();

    Box3i aabb = Box3i.Empty;

    for (int i = 0; i &lt; points.Length; i++)

    {
        aabb.Extend(points[i]):
    }</code></pre>


    Will calculate the bounding box of all the points in the array without needing a special case for the first point.
  syntax:
    content: public static readonly Box3i Empty
    return:
      type: OpenTK.Mathematics.Box3i
    content.vb: Public Shared ReadOnly Empty As Box3i
