    path: C:\Users\juliu\Documents\GitHub\opentk.net\website\opentk\src\OpenTK.Mathematics\Geometry\Box2i.cs
    startLine: 62
  assemblies:
  - OpenTK.Mathematics
  namespace: OpenTK.Mathematics
  summary: >-
    The minimum boundary of the box.

    This field is not guaranteed to be less than <xref href="OpenTK.Mathematics.Box2i.Max" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    A box with a minimum point greater than the maximum is not considered valid

    except for a single configuration where <code>Min = Vector2i.PositiveInfinity</code> and <code>Max = Vector2i.NegativeInfinity</code> as is the case with <xref href="OpenTK.Mathematics.Box2i.Empty" data-throw-if-not-resolved="false"></xref>.
  example: []
