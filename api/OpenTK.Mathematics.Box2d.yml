- uid: OpenTK.Mathematics.Box2d.Empty
  commentId: F:OpenTK.Mathematics.Box2d.Empty
  id: Empty
  parent: OpenTK.Mathematics.Box2d
  langs:
  - csharp
  - vb
  name: Empty
  nameWithType: Box2d.Empty
  fullName: OpenTK.Mathematics.Box2d.Empty
  type: Field
  source:
    id: Empty
    path: C:\Users\juliu\Documents\GitHub\opentk.net\website\opentk\src\OpenTK.Mathematics\Geometry\Box2d.cs
    startLine: 38
  assemblies:
  - OpenTK.Mathematics
  namespace: OpenTK.Mathematics
  summary: >-
    An empty box with <code>Min = Vector2d.PositiveInfinity</code> and <code>Max = Vector2d.NegativeInfinity</code>.

    This box can be used with <xref href="OpenTK.Mathematics.Box2d.Extend(OpenTK.Mathematics.Vector2d)" data-throw-if-not-resolved="false"></xref> to create a bounding box without a special case for the first point.
  example:
  - >-
    For example:


    <pre><code class="lang-csharp">Vector2d[] points = GetPoints();

    Box2d aabb = Box2d.Empty;

    for (int i = 0; i &lt; points.Length; i++)

    {
        aabb.Extend(points[i]):
    }</code></pre>


    Will calculate the bounding box of all the points in the array without needing a special case for the first point.
  syntax:
    content: public static readonly Box2d Empty
    return:
      type: OpenTK.Mathematics.Box2d
    content.vb: Public Shared ReadOnly Empty As Box2d
