  namespace: OpenTK.Mathematics
  summary: Extends this box to encapsulate a given point.
  remarks: This can be used in combination with <xref href="OpenTK.Mathematics.Box2.Empty" data-throw-if-not-resolved="false"></xref> to make an efficient bounding box calculation.
  example:
  - >-
    For example:


    <pre><code class="lang-csharp">Vector2[] points = GetPoints();

    Box2 aabb = Box2.Empty;

    for (int i = 0; i &lt; points.Length; i++)

    {
        aabb.Extend(points[i]):
    }</code></pre>


    Will calculate the bounding box of all the points in the array without needing a special case for the first point.
  syntax:
    content: public void Extend(Vector2 point)
