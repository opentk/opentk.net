  - vb
  name: DealWithVSCodeEnvironmentVariablePollution
  nameWithType: ToolkitOptions.X11Options.DealWithVSCodeEnvironmentVariablePollution
  fullName: OpenTK.Platform.ToolkitOptions.X11Options.DealWithVSCodeEnvironmentVariablePollution
  type: Property
  source:
    id: DealWithVSCodeEnvironmentVariablePollution
    path: C:\Users\juliu\Documents\GitHub\opentk.net\website\opentk\src\OpenTK.Platform\ToolkitOptions.cs
    startLine: 141
  assemblies:
  - OpenTK.Platform
  namespace: OpenTK.Platform
  summary: >-
    VSCode leaks a bunch of envrionment variables that mess with dynamic library resolution.

    If the environment variable <code>SNAP_NAME</code> is set to <code>code</code> and this variable is set to true,

    we will remove a bunch of environment variables that vscode leaks into the C# process.

    This means that if you want to set these variables yourself while running in VSCode 

    for whatever reason then you need to disable this.

    Defaults to <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">true</a>.
  remarks: >-
    Specifically all variables that have a <code>_VSCODE_SNAP_ORIG</code> version will be reset to their original values.

    But additionally the following environment variables will be removed:


    <ul><li><code>GTK_PATH</code></li><li><code>GIO_MODULE_DIR</code></li><li><code>GTK_EXE_PREFIX</code></li><li><code>GIO_LAUNCHED_DESKTOP_FILE</code></li><li><code>GIO_LAUNCHED_DESKTOP_FILE_PID</code></li><li><code>GTK_IM_MODULE_FILE</code></li><li><code>GDK_PIXBUF_MODULEDIR</code></li><li><code>GDK_PIXBUF_MODULE_FILE</code></li><li><code>GSETTINGS_SCHEMA_DIR</code></li><li><code>XDG_DATA_HOME</code></li></ul>


    After <xref href="OpenTK.Platform.Toolkit.Uninit" data-throw-if-not-resolved="false"></xref> these environment variables will be reset to their original values.


    <p>

    If this setting ever bites you, I'm sorry.

    </p>
  example: []
  syntax:
    content: public bool DealWithVSCodeEnvironmentVariablePollution { get; set; }
    parameters: []
    return:
      type: System.Boolean
    content.vb: Public Property DealWithVSCodeEnvironmentVariablePollution As Boolean
