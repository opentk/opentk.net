  name: Empty
  nameWithType: Box3d.Empty
  fullName: OpenTK.Mathematics.Box3d.Empty
  type: Field
  source:
    id: Empty
    path: C:\Users\juliu\Documents\GitHub\opentk.net\website\opentk\src\OpenTK.Mathematics\Geometry\Box3d.cs
    startLine: 38
  assemblies:
  - OpenTK.Mathematics
  namespace: OpenTK.Mathematics
  summary: >-
    An empty box with <code>Min = Vector3d.PositiveInfinity</code> and <code>Max = Vector3d.NegativeInfinity</code>.

    This box can be used with <xref href="OpenTK.Mathematics.Box3d.Extend(OpenTK.Mathematics.Vector3d)" data-throw-if-not-resolved="false"></xref> to create a bounding box without a special case for the first point.
  example:
  - >-
    For example:


    <pre><code class="lang-csharp">Vector3d[] points = GetPoints();

    Box3d aabb = Box3d.Empty;

    for (int i = 0; i &lt; points.Length; i++)

    {
        aabb.Extend(points[i]):
    }</code></pre>


    Will calculate the bounding box of all the points in the array without needing a special case for the first point.
  syntax:
    content: public static readonly Box3d Empty
    return:
      type: OpenTK.Mathematics.Box3d
    content.vb: Public Shared ReadOnly Empty As Box3d
