  name: Empty
  nameWithType: Box2i.Empty
  fullName: OpenTK.Mathematics.Box2i.Empty
  type: Field
  source:
    id: Empty
    path: C:\Users\juliu\Documents\GitHub\opentk.net\website\opentk\src\OpenTK.Mathematics\Geometry\Box2i.cs
    startLine: 37
  assemblies:
  - OpenTK.Mathematics
  namespace: OpenTK.Mathematics
  summary: >-
    An empty box with <code>Min = Vector2i.MaxValue</code> and <code>Max = Vector2i.MinValue</code>.

    This box can be used with <xref href="OpenTK.Mathematics.Box2i.Extend(OpenTK.Mathematics.Vector2i)" data-throw-if-not-resolved="false"></xref> to create a bounding box without a special case for the first point.
  example:
  - >-
    For example:


    <pre><code class="lang-csharp">Vector2i[] points = GetPoints();

    Box2i aabb = Box2i.Empty;

    for (int i = 0; i &lt; points.Length; i++)

    {
        aabb.Extend(points[i]):
    }</code></pre>


    Will calculate the bounding box of all the points in the array without needing a special case for the first point.
  syntax:
    content: public static readonly Box2i Empty
    return:
      type: OpenTK.Mathematics.Box2i
    content.vb: Public Shared ReadOnly Empty As Box2i
