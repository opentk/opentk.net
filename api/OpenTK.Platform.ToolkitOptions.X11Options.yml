  assemblies:
  - OpenTK.Platform
  namespace: OpenTK.Platform
  summary: >-
    If this option is set to true, the custom dll resolver used to load native dependencies

    will print out to the <xref href="OpenTK.Platform.ToolkitOptions.Logger" data-throw-if-not-resolved="false"></xref> debug information about exact

    paths for loaded <code>.so</code> files. Can be useful when debugging library resolution issues.
  example: []
