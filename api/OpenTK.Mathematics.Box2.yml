  assemblies:
  - OpenTK.Mathematics
  namespace: OpenTK.Mathematics
  summary: >-
    The minimum boundary of the box.

    This field is not guaranteed to be less than <xref href="OpenTK.Mathematics.Box2.Max" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    A box with a minimum point greater than the maximum is not considered valid

    except for a single configuration where <code>Min = Vector2.PositiveInfinity</code> and <code>Max = Vector2.NegativeInfinity</code> as is the case with <xref href="OpenTK.Mathematics.Box2.Empty" data-throw-if-not-resolved="false"></xref>.
